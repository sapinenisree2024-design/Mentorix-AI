<!DOCTYPE html>
<html>

<head>
<title>Mentorix AI Portal</title>

<style>

/* ================= GLOBAL ================= */
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:"Segoe UI", sans-serif;

    background: radial-gradient(circle at top, #111827, #050816, #020617);
    color:white;
    overflow:hidden;
    position:relative;
}

/* ================= BACKGROUND ================= */
body::before{
    content:"";
    position:absolute;
    width:200%;
    height:200%;
    left:-50%;
    top:-50%;
    background: radial-gradient(circle, rgba(59,130,246,0.15), transparent 60%);
    animation: waveMove 10s linear infinite;
    z-index:0;
}

body::after{
    content:"";
    position:absolute;
    width:100%;
    height:100%;
    background:
        linear-gradient(rgba(59,130,246,0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(59,130,246,0.05) 1px, transparent 1px);
    background-size:50px 50px;
    animation:gridMove 12s linear infinite;
    z-index:0;
    opacity:0.4;
}

@keyframes waveMove{
    0%{ transform:translate(0,0) scale(1); }
    50%{ transform:translate(80px,60px) scale(1.1); }
    100%{ transform:translate(0,0) scale(1); }
}

@keyframes gridMove{
    0%{transform:translateY(0);}
    100%{transform:translateY(50px);}
}

/* ================= CARD ================= */
.box{
    width:340px;
    padding:35px;
    border-radius:18px;

    background:rgba(255,255,255,0.05);
    border:1px solid rgba(59,130,246,0.25);
    backdrop-filter: blur(18px);
    text-align:center;

    position:relative;
    z-index:1;

    box-shadow:
        0 0 20px rgba(59,130,246,0.2),
        inset 0 0 10px rgba(255,255,255,0.05);

    animation: floatBox 4s ease-in-out infinite;
}

@keyframes floatBox{
    0%{ transform:translateY(0); }
    50%{ transform:translateY(-8px); }
    100%{ transform:translateY(0); }
}

/* ================= 🤖 MACHINE TITLE ================= */
h1{
    margin-bottom:5px;
    font-size:30px;
    font-weight:900;
    letter-spacing:3px;
    text-transform:uppercase;

    color:#dbeafe;

    position:relative;
    overflow:hidden;
}

/* scanning machine line */
h1::before{
    content:"";
    position:absolute;
    top:0;
    left:-100%;
    width:100%;
    height:100%;
    background: linear-gradient(
        90deg,
        transparent,
        rgba(59,130,246,0.25),
        transparent
    );
    animation: scan 2.5s linear infinite;
}

@keyframes scan{
    0%{ left:-100%; }
    100%{ left:100%; }
}

/* ================= INPUT ================= */
input{
    width:92%;
    padding:13px;
    margin:8px 0;

    border-radius:12px;
    border:1px solid rgba(59,130,246,0.25);

    background:rgba(2,6,23,0.7);
    color:white;
    outline:none;
}

input:focus{
    border-color:#3b82f6;
    box-shadow:0 0 15px rgba(59,130,246,0.5);
}

/* ================= BUTTON ================= */
button{
    width:95%;
    padding:13px;
    margin-top:10px;

    border:none;
    border-radius:12px;

    background:linear-gradient(90deg,#1d4ed8,#3b82f6,#60a5fa);
    color:white;
    font-weight:bold;

    cursor:pointer;
    transition:0.25s;
    box-shadow:0 0 15px rgba(59,130,246,0.4);
}

button:hover{
    transform:translateY(-2px) scale(1.05);
    box-shadow:0 0 25px rgba(59,130,246,0.7);
}

button:active{
    transform:scale(0.95);
}

/* ================= SWITCH ================= */
.switch{
    margin-top:12px;
    font-size:13px;
    cursor:pointer;
    opacity:0.7;
}

.switch:hover{
    opacity:1;
    color:#60a5fa;
}

/* ================= HIDDEN ================= */
.hidden{
    display:none;
}

</style>

</head>

<body>

<div class="box">

    <h1>Mentorix AI</h1>
    <p>System Online</p>

    <!-- LOGIN -->
    <div id="loginBox">

        <form method="POST" action="/login">
            <input type="text" name="username" placeholder="Username" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Sign In</button>
        </form>

        <div class="switch" onclick="toggle()">Create new account</div>

    </div>

    <!-- SIGNUP -->
    <div id="signupBox" class="hidden">

        <form method="POST" action="/signup">
            <input type="text" name="username" placeholder="Create Username" required>
            <input type="password" name="password" placeholder="Create Password" required>
            <button type="submit">Create Account</button>
        </form>

        <div class="switch" onclick="toggle()">Already have account? Sign in</div>

    </div>

</div>

<script>
function toggle(){
    document.getElementById("loginBox").classList.toggle("hidden");
    document.getElementById("signupBox").classList.toggle("hidden");
}
</script>

</body>
</html>
