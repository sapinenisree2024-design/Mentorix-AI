<!DOCTYPE html>
<html>
<head>
<title>Mentor AI</title>

<style>

/* ================= BACKGROUND ================= */
body{
    margin:0;
    font-family:"Segoe UI", sans-serif;
    color:white;

    background: radial-gradient(circle at top, #0f172a, #020617);
    overflow-x:hidden;
}

/* animated glow blobs */
.glow{
    position:fixed;
    width:400px;
    height:400px;
    border-radius:50%;
    filter: blur(120px);
    opacity:0.4;
    z-index:-1;
    animation: float 8s infinite ease-in-out;
}

.glow.blue{ background:#3b82f6; top:10%; left:10%; }
.glow.purple{ background:#6366f1; bottom:10%; right:10%; }

@keyframes float{
    0%{ transform:translateY(0px) }
    50%{ transform:translateY(30px) }
    100%{ transform:translateY(0px) }
}

/* ================= TITLE ================= */
h1{
    text-align:center;
    margin-top:30px;
    font-size:32px;
    color:#60a5fa;
    text-shadow:0 0 15px rgba(59,130,246,0.6);
}

/* ================= COACH BADGE ================= */
.badge{
    text-align:center;
    margin-top:10px;
}

.badge span{
    background:rgba(59,130,246,0.2);
    padding:8px 14px;
    border-radius:20px;
    border:1px solid rgba(59,130,246,0.4);
    color:#93c5fd;
}

/* ================= CARD ================= */
.card{
    width:70%;
    max-width:700px;
    margin:40px auto;
    padding:25px;

    background:rgba(255,255,255,0.05);
    border:1px solid rgba(59,130,246,0.2);
    border-radius:18px;

    backdrop-filter: blur(12px);
    box-shadow:0 10px 40px rgba(0,0,0,0.5);
}

/* headings */
h2{
    color:#93c5fd;
    margin-top:20px;
}

/* text */
p, pre{
    color:#e5e7eb;
    line-height:1.6;
}

/* AI response box */
pre{
    background:rgba(15,23,42,0.6);
    padding:15px;
    border-radius:12px;
    border-left:3px solid #3b82f6;
    white-space:pre-wrap;
}

/* back button */
button{
    display:block;
    margin:20px auto;
    padding:12px 18px;

    background:#3b82f6;
    border:none;
    border-radius:10px;

    color:white;
    font-weight:bold;
    cursor:pointer;

    transition:0.3s;
}

button:hover{
    background:#2563eb;
    transform:scale(1.05);
    box-shadow:0 0 15px rgba(59,130,246,0.4);
}

</style>

</head>

<body>

<!-- glowing background -->
<div class="glow blue"></div>
<div class="glow purple"></div>

<h1> Mentor AI Assistant</h1>

<div class="badge">
    <span>Coach Mode: {{ coach }}</span>
</div>

<div class="card">

    <h2>🎯 Goal</h2>
    <p>{{ goal }}</p>

    <h2>⏱ Time</h2>
    <p>{{ time.split('.')[0] }}</p>

    <h2>🤖 AI Response</h2>
    <pre>{{ response }}</pre>

</div>

<a href="/dashboard">
    <button>⬅ Back to Dashboard</button>
</a>

</body>
</html>
