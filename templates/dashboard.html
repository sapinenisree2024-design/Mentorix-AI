<!DOCTYPE html>
<html>

<head>
<title>Mentorix AI Dashboard</title>

<style>

body{
    margin:0;
    font-family: "Segoe UI", sans-serif;
    color:white;

    background: 
        linear-gradient(rgba(10,25,47,0.55), rgba(10,25,47,0.55)),
        url("https://static.vecteezy.com/system/resources/previews/015/882/420/non_2x/modern-minimalist-dark-blue-premium-abstract-background-with-luxury-geometric-dark-shape-exclusive-wallpaper-design-for-website-poster-brochure-presentation-free-vector.jpg");

    background-size:cover;
    background-position:center;
    background-attachment:fixed;
}

/* TOP BAR */

.topBar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px 25px;
}

/* DASHBOARD TITLE */

.dashboardTitle{

    color:#93c5fd;

    font-size:30px;

    font-weight:900;

    letter-spacing:2px;

    text-transform:uppercase;

    padding:12px 18px;

    border-radius:14px;

    background:
    linear-gradient(
    135deg,
    rgba(59,130,246,0.25),
    rgba(37,99,235,0.25)
    );

    border:2px solid rgba(147,197,253,0.4);

    box-shadow:
    0 0 12px rgba(96,165,250,0.25);

    text-shadow:
    0 0 5px rgba(255,255,255,0.4);

    margin-top:10px;
}

/* LOGOUT */

.logout-btn{
    background:#ff3b3b;
    color:white;
    border:none;
    padding:12px 18px;
    border-radius:12px;
    font-weight:bold;
    cursor:pointer;
    transition:0.25s;
}

.logout-btn:hover{
    background:#e60000;
    transform:scale(1.03);
}

/* HEADER */

.header{
    padding:25px;
    text-align:center;
    background:rgba(15,39,71,0.75);
    backdrop-filter: blur(10px);
    border-bottom:1px solid rgba(255,255,255,0.08);
}

.header h2{
    font-size:28px;
    margin:0;
    color:#4ea1ff;
}

.header span{
    color:#a8d0ff;
}

/* CONTAINER */

.container{
    max-width:700px;
    margin:auto;
    padding:20px;
}

/* CARD */

.card{
    background:rgba(16,42,74,0.85);
    padding:20px;
    margin-bottom:20px;
    border-radius:16px;
    border:1px solid rgba(78,161,255,0.2);
    transition:0.25s;
    backdrop-filter: blur(8px);
}

.card:hover{

    transform:translateY(-1px);

    box-shadow:
    0 4px 12px rgba(78,161,255,0.15);

    border-color:#4ea1ff;
}

/* INPUT */

input{
    width:100%;
    padding:12px;
    margin-top:10px;
    border-radius:10px;
    border:1px solid rgba(255,255,255,0.15);
    background:rgba(10,25,47,0.8);
    color:white;
    outline:none;
}

input:focus{
    border-color:#4ea1ff;
}

/* BUTTONS */

button{
    margin-top:10px;
    padding:14px 18px;
    border:none;
    border-radius:14px;
    background:linear-gradient(
        135deg,
        #4ea1ff,
        #2563eb
    );
    color:white;
    font-weight:bold;
    font-size:15px;
    cursor:pointer;
    transition:0.25s ease-in-out;
    box-shadow:0 0 10px rgba(78,161,255,0.2);
}

button:hover{

    transform:
    translateY(-2px)
    scale(1.02);

    background:linear-gradient(
        135deg,
        #60a5fa,
        #1d4ed8
    );

    box-shadow:
    0 0 10px rgba(96,165,250,0.35);
}

button:active{
    transform:scale(0.97);
}

/* FEATURE BUTTONS */

.sideButtons{

    display:flex;

    justify-content:center;

    align-items:center;

    gap:18px;

    flex-wrap:wrap;
}

.sideBtn{

    width:200px;

    padding:18px;

    font-size:18px;

    border-radius:18px;

    background:
    linear-gradient(
    135deg,
    #3b82f6,
    #2563eb
    );

    box-shadow:
    0 0 12px rgba(59,130,246,0.25);

    transition:0.25s;
}

.sideBtn:hover{

    transform:
    translateY(-2px)
    scale(1.02);

    box-shadow:
    0 0 12px rgba(96,165,250,0.35);
}

</style>

</head>

<body>

<!-- TOP BAR -->

<div class="topBar">

    <div class="dashboardTitle">
         DASHBOARD 
    </div>

    <a href="/logout">
        <button class="logout-btn">
            Logout
        </button>
    </a>

</div>

<!-- HEADER -->

<div class="header">

    <h2>
        Welcome <span>{{ username }}</span>
    </h2>

    <p style="color:#a8d0ff;">
        Coach: {{ coach }}
    </p>

</div>

<!-- DASHBOARD -->

<div class="container">

    <!-- COACH -->

    <div class="card">

        <h3>Select Coach</h3>

        <form action="/set_coach" method="POST">

            <button name="coach" value="strict">
                💀 Strict
            </button>

            <button name="coach" value="motivator">
                🔥 Motivator
            </button>

            <button name="coach" value="chill">
                😌 Chill
            </button>

            <button name="coach" value="friendly">
                😊 Friendly
            </button>

        </form>

    </div>

    <!-- GOAL -->

    <div class="card">

        <h3>Set Goal</h3>

        <form action="/goal" method="POST">

            <input
            type="text"
            name="goal"
            placeholder="Your goal">

            <button>
                Send
            </button>

        </form>

    </div>

    <!-- FEATURE BUTTONS -->

    <div class="card">

        <div class="sideButtons">

            <a href="/history">
                <button class="sideBtn">
                     History
                </button>
            </a>

            <a href="/focus">
                <button class="sideBtn">
                     Focus Mode
                </button>
            </a>

            <a href="/leaderboard">
                <button class="sideBtn">
                     Leaderboard
                </button>
            </a>

        </div>

    </div>

</div>

</body>

</html>
